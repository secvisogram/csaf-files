name: 'Trigger CSAF Publish'

# Runs when advisories change on main and asks secvisogram.github.io to
# validate, sign and publish them. See README.md ("Architecture") for the
# full picture.

on:
  push:
    branches:
      - main
    paths:
      - 'advisories/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-publish:
    runs-on: ubuntu-24.04
    name: Dispatch publish event to secvisogram.github.io

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: secvisogram
          repositories: secvisogram.github.io

      - name: Dispatch csaf-publish event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/secvisogram/secvisogram.github.io/dispatches \
            -f event_type=csaf-publish \
            -f 'client_payload[source_sha]=${{ github.sha }}'
